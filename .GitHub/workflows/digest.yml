# Save this file as .github/workflows/digest.yml in your repo.
# Runs the digest generator on a schedule and publishes docs/index.html
# via GitHub Pages — entirely free, no API keys needed.

name: news-gossip-digest

on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore seen.json
        uses: actions/cache@v4
        with:
          path: seen.json
          key: seen-state-${{ github.run_id }}
          restore-keys: |
            seen-state-

      - name: Generate digest
        run: python digest_generator.py

      - name: Commit digest + state
        run: |
          git config user.name "news-gossip-digest"
          git config user.email "actions@github.com"
          git add docs/index.html seen.json
          git diff --cached --quiet || git commit -m "update digest"
          git push
